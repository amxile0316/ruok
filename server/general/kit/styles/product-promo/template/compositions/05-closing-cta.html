<style>

  #cta .ground{position:absolute;inset:0;

  #cta .mark{position:absolute;left:50%;top:326px;width:236px;height:236px;margin:-118px 0 0 -118px;border-radius:50%;

    font-family:serif;font-size:118px;font-weight:600;color:#d6a85f;
    text-shadow:0 0 34px rgba(214,168,95,.40);
    opacity:0;transform:translateY(26px) scale(.96);animation:mark-in .62s cubic-bezier(.22,.61,.36,1) both}
  #cta .brand{position:absolute;left:0;right:0;top:480px;text-align:center;
    font-family:serif;font-size:66px;font-weight:600;letter-spacing:.02em;
    opacity:0;animation:rise .55s .36s cubic-bezier(.22,.61,.36,1) both}
  #cta .btn{position:absolute;left:50%;top:626px;transform:translateX(-50%);padding:24px 62px;border-radius:999px;
    background:linear-gradient(180deg,#e6c489,#d6a85f);color:#17130b;font-size:32px;font-weight:600;letter-spacing:.02em;

  #cta .url{position:absolute;left:0;right:0;top:824px;text-align:center;font-size:26px;letter-spacing:.2em;

  #cta .fine{position:absolute;left:0;right:0;bottom:96px;text-align:center;font-size:20px;letter-spacing:.18em;
    color:rgba(199,211,206,.5);opacity:0;animation:fade .6s 1.2s linear both}
  @keyframes mark-in{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
  @keyframes btn-in{from{opacity:0;transform:translate(-50%,18px)}to{opacity:1;transform:translate(-50%,0)}}
  @keyframes breathe{0%{opacity:.55;transform:scale(.94)}45%{opacity:1;transform:scale(1.03)}100%{opacity:.6;transform:scale(.97)}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
