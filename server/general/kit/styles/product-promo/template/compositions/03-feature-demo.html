<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"></head>
<body>
<template>
<style>
  #demo{--step-gap:220ms;--fill:78%;
    position:absolute;inset:0;overflow:hidden;color:#eef4f0;background:#0c1211;
    font-family:sans-serif}
  #demo .ground{position:absolute;inset:0;
    background:radial-gradient(1000px 720px at 78% 8%,rgba(47,90,85,.30),transparent 66%)}
  #demo .grid{position:absolute;inset:0;
    background-image:linear-gradient(rgba(31,46,42,.55) 1px,transparent 1px),linear-gradient(90deg,rgba(31,46,42,.55) 1px,transparent 1px);
    background-size:96px 96px;opacity:.5;
    -webkit-mask-image:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent);
    mask-image:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent)}
  #demo .head{position:absolute;left:150px;top:132px}
  #demo .kicker{font-size:24px;letter-spacing:.24em;color:#6fb3a2;text-transform:uppercase;
    opacity:0;animation:rise .5s .12s cubic-bezier(.22,.61,.36,1) both}
  #demo h2{margin:20px 0 0;font-family:serif;font-weight:600;font-size:84px;line-height:1.1;
    opacity:0;animation:rise .6s .24s cubic-bezier(.22,.61,.36,1) both}
  #demo .steps{position:absolute;left:150px;top:404px;width:1620px;display:flex;flex-direction:column;gap:34px}
  #demo .step{position:relative;display:grid;grid-template-columns:132px 1fr 320px;align-items:center;
    gap:44px;padding:40px 52px;border-radius:14px;border:1px solid rgba(79,143,128,.24);
    background:linear-gradient(150deg,rgba(31,46,42,.72),rgba(19,29,27,.86));
    box-shadow:inset 0 1px 0 rgba(111,179,162,.14),0 18px 46px rgba(0,0,0,.38);
    opacity:0;transform:translateY(34px);
    animation:step-in .6s cubic-bezier(.22,.61,.36,1) both;animation-delay:calc(.3s + var(--i) * var(--step-gap))}
  #demo .num{font-family:serif;font-size:52px;font-weight:600;color:#8a6534;
    transition:none;animation:num-on .5s cubic-bezier(.22,.61,.36,1) both;animation-delay:calc(.62s + var(--i) * var(--step-gap))}
  #demo .label{font-size:40px;font-weight:500;letter-spacing:.01em}
  #demo .label small{display:block;margin-top:10px;font-size:23px;font-weight:400;color:#c7d3ce;letter-spacing:.02em}
  #demo .bar{position:relative;height:4px;border-radius:999px;background:rgba(79,143,128,.18)}
  #demo .bar i{position:absolute;inset:0 auto 0 0;width:0;border-radius:999px;
    background:linear-gradient(90deg,#4f8f80,#d6a85f);
    animation:fill .9s cubic-bezier(.22,.61,.36,1) both;animation-delay:calc(.86s + var(--i) * var(--step-gap))}
  #demo .bar b{position:absolute;right:0;top:-34px;font-size:22px;font-weight:500;color:#6fb3a2}
  @keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}
  @keyframes step-in{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:translateY(0)}}
  @keyframes num-on{from{color:#8a6534}to{color:#d6a85f}}
  @keyframes fill{from{width:0}to{width:var(--fill)}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
</style>
<div id="demo" data-composition-id="shot-3-demo" data-width="1920" data-height="1080" data-duration="6" data-no-timeline>
  <div class="ground"></div>
  <div class="grid"></div>
  <div class="head">
    <div class="kicker">How it works</div>
    <h2>三步出片</h2>
  </div>
  <div class="steps">
    <div class="step" style="--i:0;--fill:62%">
      <div class="num">01</div>
      <div class="label">拆本<small>把长素材切成可编辑的镜头</small></div>
      <div class="bar"><b>62%</b><i></i></div>
    </div>
    <div class="step" style="--i:1;--fill:78%">
      <div class="num">02</div>
      <div class="label">配方<small>选一套风格包，镜头自动排队</small></div>
      <div class="bar"><b>78%</b><i></i></div>
    </div>
    <div class="step" style="--i:2;--fill:92%">
      <div class="num">03</div>
      <div class="label">出片<small>本机渲染，逐句改字幕</small></div>
      <div class="bar"><b>92%</b><i></i></div>
    </div>
  </div>
</div>
</template>
</body>
</html>
